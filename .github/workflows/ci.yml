name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev + ml extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Lint — critical errors (blocking)
        # syntax errors and undefined names fail the build; style is advisory below
        run: flake8 src tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style (advisory)
        continue-on-error: true
        run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503 --statistics

      - name: Run tests
        run: pytest -q
